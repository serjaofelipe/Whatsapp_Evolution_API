<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsAjax - QR Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;800&display=swap');
        :root {
            --bg-color: #05090c;
            --glass-bg: rgba(17, 27, 33, 0.72);
            --glass-border: rgba(37, 211, 102, 0.18);
            --text-color: #e9edef;
            --accent: #00A884;
            --wa-green: #25D366;
            --success: #25D366;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(0,168,132,0.28), transparent 60%),
                radial-gradient(1000px 500px at 100% 0%, rgba(37,211,102,0.14), transparent 55%),
                linear-gradient(160deg, #071a17 0%, #05090c 55%, #04120f 100%);
            background-size: 200% 200%;
            animation: bg-shift 22s ease-in-out infinite;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        @keyframes bg-shift {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 100%; }
            100% { background-position: 0% 0%; }
        }
        /* Ondas animadas */
        .waves { position: fixed; bottom: 0; left: 0; width: 100%; height: 40vh; min-height: 200px; z-index: 0; }
        .wave-parallax > use { animation: wave-move 25s cubic-bezier(0.55,0.5,0.45,0.5) infinite; }
        .wave-parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 9s; }
        .wave-parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 13s; }
        .wave-parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 17s; }
        .wave-parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 23s; }
        @keyframes wave-move {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }
        .brand-title { font-weight: 800; }
        .brand-accent { color: var(--wa-green); }
        .glass-panel {
            position: relative;
            z-index: 2;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }
        .glass-panel:hover {
            box-shadow: 0 25px 50px -12px rgba(37, 211, 102, 0.35);
            border-color: rgba(37, 211, 102, 0.4);
        }
        .qr-logo {
            width: 64px; height: 64px; margin: 0 auto 1rem;
            border-radius: 18px; display: flex; align-items: center; justify-content: center;
            font-size: 32px; color: #fff;
            background: linear-gradient(135deg, var(--wa-green), #075E54);
            box-shadow: 0 10px 24px rgba(37,211,102,0.35);
        }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700; }
        p { font-size: 0.875rem; color: #94a3b8; margin-bottom: 2rem; }
        .qr-container {
            background: white;
            padding: 1rem;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 1.5rem;
            min-height: 250px;
            min-width: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-container img { max-width: 100%; border-radius: 8px; }
        .status { display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.875rem; font-weight: 500; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .status-dot.connected { background: var(--success); box-shadow: 0 0 10px var(--success); }
        .status-dot.connecting { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        .btn-logout { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; margin-top: 1rem; display: none; transition: background 0.2s; width: 100%; }
        .btn-logout:hover { background: #dc2626; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Ondas animadas de fundo -->
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
            <path id="wa-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
        </defs>
        <g class="wave-parallax">
            <use xlink:href="#wa-wave" href="#wa-wave" x="48" y="0" fill="rgba(37,211,102,0.5)" />
            <use xlink:href="#wa-wave" href="#wa-wave" x="48" y="3" fill="rgba(0,168,132,0.35)" />
            <use xlink:href="#wa-wave" href="#wa-wave" x="48" y="5" fill="rgba(18,140,126,0.22)" />
            <use xlink:href="#wa-wave" href="#wa-wave" x="48" y="7" fill="rgba(7,94,84,0.85)" />
        </g>
    </svg>

    <div class="glass-panel">
        <div class="qr-logo"><i class="fab fa-whatsapp"></i></div>
        <h1 class="brand-title">Whats<span class="brand-accent">Ajax</span> Gateway</h1>
        <p>Conecte seu WhatsApp lendo o QR Code abaixo</p>
        <div class="qr-container" id="qr-box">
            <div class="loader" id="loader"></div>
            <img id="qr-image" src="" alt="QR Code" style="display: none;">
        </div>
        <div class="status">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">Aguardando Conexão API...</span>
        </div>
        <button class="btn-logout" id="btn-logout" onclick="logout()">Desconectar Conta</button>
    </div>
    <script>
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                const state = data?.instance?.state || data?.state;
                const dot = document.getElementById('status-dot');
                const text = document.getElementById('status-text');
                const btnLogout = document.getElementById('btn-logout');
                if (state === 'open') {
                    dot.className = 'status-dot connected';
                    text.innerText = 'Conectado (Online)';
                    const loader = document.getElementById('loader');
                    const qrImage = document.getElementById('qr-image');
                    if(loader) loader.style.display = 'none';
                    if(qrImage) { qrImage.style.display = 'none'; qrImage.parentElement.innerHTML = '<h2 style="color: black;">WhatsApp Conectado!</h2>'; }
                    btnLogout.style.display = 'block';
                } else if (state === 'connecting') {
                    dot.className = 'status-dot connecting';
                    text.innerText = 'Conectando...';
                    btnLogout.style.display = 'none';
                    fetchQR();
                } else {
                    dot.className = 'status-dot';
                    text.innerText = 'Aguardando QR Code...';
                    btnLogout.style.display = 'none';
                    fetchQR();
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-text').innerText = err.message || 'Erro ao conectar à API (Evolution Offline?)';
            }
        }
        async function fetchQR() {
            try {
                const response = await fetch('/api/qr');
                const data = await response.json();
                if (data.base64) {
                    const loader = document.getElementById('loader');
                    if (loader) loader.style.display = 'none';
                    let qrImg = document.getElementById('qr-image');
                    if (!qrImg) {
                        const qrBox = document.getElementById('qr-box');
                        qrBox.innerHTML = '<div class="loader" id="loader" style="display:none;"></div><img id="qr-image" src="" alt="QR Code">';
                        qrImg = document.getElementById('qr-image');
                    }
                    qrImg.src = data.base64;
                    qrImg.style.display = 'block';
                }
            } catch (err) { console.error("Erro ao buscar QR:", err); }
        }
        async function logout() {
            if(!confirm("Tem certeza que deseja desconectar o WhatsApp atual?")) return;
            const btn = document.getElementById('btn-logout');
            btn.innerText = "Desconectando...";
            btn.disabled = true;
            try {
                await fetch('/api/logout', { method: 'POST' });
                setTimeout(() => { window.location.reload(); }, 1500);
            } catch(e) {
                alert("Erro ao desconectar!");
                btn.innerText = "Desconectar Conta";
                btn.disabled = false;
            }
        }
        setInterval(checkStatus, 5000);
        checkStatus();
    </script>
</body>
</html>
